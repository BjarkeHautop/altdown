<script>
(function () {
  function contentLeft(main) {
    // With margin content, <main> is a full-width grid; use the title.
    if (main.classList.contains("page-full")) {
      var heading = main.querySelector("h1");
      if (heading) return heading.getBoundingClientRect().left;
    }
    return main.getBoundingClientRect().left;
  }
  // Where the body text starts depends on the page layout, so measure it.
  // With a docked sidebar (`navbar: style: sidebar`), the title stays above
  // the sidebar instead.
  function alignNavbarToContent() {
    var main = document.querySelector("#quarto-document-content");
    var navContainer = document.querySelector(".navbar-container");
    if (!main || !navContainer || document.body.classList.contains("docked")) {
      return;
    }
    navContainer.style.paddingLeft = "";
    var diff = contentLeft(main) -
      navContainer.getBoundingClientRect().left;
    navContainer.style.paddingLeft = Math.max(diff, 0) + "px";
    // Where the navbar is crowded (just past its collapse breakpoint), give
    // the padding back to a title that would otherwise be cut off.
    var brand = navContainer.querySelector(".navbar-brand");
    var overflow = brand ? brand.scrollWidth - brand.clientWidth : 0;
    if (overflow > 0) {
      navContainer.style.paddingLeft = Math.max(diff - overflow, 0) + "px";
    }
  }
  // Wrap the version in the "<pkg> <version>" title so it can be styled.
  function shrinkNavbarVersion() {
    var title = document.querySelector(".navbar-title");
    if (!title || title.querySelector(".navbar-version")) return;
    var text = title.textContent;
    var spaceIndex = text.indexOf(" ");
    if (spaceIndex === -1) return;
    title.textContent = text.slice(0, spaceIndex);
    var version = document.createElement("small");
    version.className = "navbar-version";
    version.textContent = text.slice(spaceIndex + 1);
    title.appendChild(document.createTextNode(" "));
    title.appendChild(version);
  }
  // Leave `#>` output lines out of what the copy button copies. clipboard.js copies synchronously in its click handler, so a copy
  // event during a copy-button click is its.
  function stripOutputOnCopy() {
    var fromButton = false;
    window.addEventListener("click", function (e) {
      if (!e.target.closest || !e.target.closest(".code-copy-button")) return;
      fromButton = true;
      setTimeout(function () { fromButton = false; }, 0);
    }, true);
    document.addEventListener("copy", function (e) {
      if (!fromButton || !e.clipboardData) return;
      // clipboard.js copies from a hidden <textarea>, whose selection
      // window.getSelection() doesn't report in every browser.
      var text = e.target instanceof HTMLTextAreaElement ?
        e.target.value : String(window.getSelection());
      var code = text.split("\n").filter(function (line) {
        return !/^#>/.test(line);
      }).join("\n");
      if (code === text) return;
      e.clipboardData.setData("text/plain", code);
      e.preventDefault();
    }, true);
  }
  // Shows the tip of a reference to the package's own topics, from the
  // page's hidden `.quartodown-tip-payload` (see add_tooltips_html()), in
  // one `position: fixed` element, so code blocks' `overflow: auto` can't
  // clip it.
  function initTooltips() {
    var payload = document.querySelector(".quartodown-tip-payload");
    if (!payload) return;
    var float = document.createElement("div");
    float.className = "quartodown-tip-float";
    float.setAttribute("role", "tooltip");
    document.body.appendChild(float);
    var hideTimer;
    function place(el) {
      var r = el.getBoundingClientRect();
      var top = r.bottom + 6;
      var left = r.left;
      var maxLeft = window.innerWidth - float.offsetWidth - 8;
      if (left > maxLeft) left = Math.max(8, maxLeft);
      var maxTop = window.innerHeight - float.offsetHeight - 8;
      if (top > maxTop) top = Math.max(8, r.top - float.offsetHeight - 6);
      float.style.top = top + "px";
      float.style.left = left + "px";
    }
    function show(el) {
      var key = el.getAttribute("data-quartodown-tip");
      var tip = payload.querySelector('[data-for="' + key + '"]');
      if (!tip) return;
      float.innerHTML = tip.innerHTML;
      float.style.display = "block";
      place(el);
    }
    function hide() { float.style.display = "none"; }
    function cancelHide() { clearTimeout(hideTimer); }
    function scheduleHide() { hideTimer = setTimeout(hide, 150); }
    document.querySelectorAll("a.quartodown-tip-ref").forEach(function (el) {
      el.addEventListener("mouseenter", function () { cancelHide(); show(el); });
      el.addEventListener("mouseleave", scheduleHide);
      el.addEventListener("focus", function () { show(el); });
      el.addEventListener("blur", hide);
    });
    float.addEventListener("mouseenter", cancelHide);
    float.addEventListener("mouseleave", scheduleHide);
  }
  stripOutputOnCopy();
  // The payload comes after this script, at the end of the body.
  document.addEventListener("DOMContentLoaded", initTooltips);
  shrinkNavbarVersion();
  alignNavbarToContent();
  window.addEventListener("load", alignNavbarToContent);
  window.addEventListener("resize", alignNavbarToContent);
})();
</script>
