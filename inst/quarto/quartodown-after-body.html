<!--
A fixed CSS padding can't align the navbar title with the body text on every
page: Quarto lays pages out differently depending on whether they have margin
content (like the home page's Links/License column) or not, so the body's left
edge lands at a different pixel offset per page type. Measure it for real
instead, on every page, after layout settles.
-->
<script>
(function () {
  function contentLeft(main) {
    // On pages with margin content (e.g. the home page's
    // Links/License column), <main> itself becomes a "page-full"
    // grid spanning the whole viewport, so its own box tells us
    // nothing about where the visible text starts — look at the
    // title instead. On every other page, main's own edge already
    // sits flush with the text.
    if (main.classList.contains("page-full")) {
      var heading = main.querySelector("h1");
      if (heading) return heading.getBoundingClientRect().left;
    }
    return main.getBoundingClientRect().left;
  }
  function alignNavbarToContent() {
    var main = document.querySelector("#quarto-document-content");
    var navContainer = document.querySelector(".navbar-container");
    if (!main || !navContainer) return;
    navContainer.style.paddingLeft = "";
    var diff = contentLeft(main) -
      navContainer.getBoundingClientRect().left;
    navContainer.style.paddingLeft = Math.max(diff, 0) + "px";
  }
  // The navbar title is emitted as one plain-text node, "<pkg name>
  // <version>" (see `website.title` in quarto_config()) -
  // Quarto gives us no way to style just the version at the YAML
  // level. Split it out into its own `<small>` here so
  // quartodown.scss can shrink it, pkgdown style.
  function shrinkNavbarVersion() {
    var title = document.querySelector(".navbar-title");
    if (!title || title.querySelector(".navbar-version")) return;
    var text = title.textContent;
    var spaceIndex = text.indexOf(" ");
    if (spaceIndex === -1) return;
    title.textContent = text.slice(0, spaceIndex);
    var version = document.createElement("small");
    version.className = "navbar-version";
    version.textContent = text.slice(spaceIndex + 1);
    title.appendChild(document.createTextNode(" "));
    title.appendChild(version);
  }
  // This script is injected right before </body>, so everything it
  // reads is already in the DOM — no need to wait for "load" (which
  // fires only once every image/font/subresource finishes, causing
  // a visible flash where the navbar sits unaligned for a moment).
  // Run once immediately, then keep "load"/"resize" as safety nets
  // in case something later shifts the layout (e.g. a web font
  // swap, though this theme doesn't use one).
  // Code output is printed in the code's block as `#>` lines. Quarto's copy
  // button (clipboard.js) copies the block's whole text, so drop those lines
  // from what it copies, as pkgdown does. clipboard.js copies synchronously
  // in its click handler, so a copy event during a copy-button click is its.
  function stripOutputOnCopy() {
    var fromButton = false;
    window.addEventListener("click", function (e) {
      if (!e.target.closest || !e.target.closest(".code-copy-button")) return;
      fromButton = true;
      setTimeout(function () { fromButton = false; }, 0);
    }, true);
    document.addEventListener("copy", function (e) {
      if (!fromButton || !e.clipboardData) return;
      // clipboard.js copies from a hidden <textarea>, whose selection
      // window.getSelection() doesn't report in every browser.
      var text = e.target instanceof HTMLTextAreaElement ?
        e.target.value : String(window.getSelection());
      var code = text.split("\n").filter(function (line) {
        return !/^#>/.test(line);
      }).join("\n");
      if (code === text) return;
      e.clipboardData.setData("text/plain", code);
      e.preventDefault();
    }, true);
  }
  stripOutputOnCopy();
  shrinkNavbarVersion();
  alignNavbarToContent();
  window.addEventListener("load", alignNavbarToContent);
  window.addEventListener("resize", alignNavbarToContent);
})();
</script>
