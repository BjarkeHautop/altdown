<!--
Quarto ignores `prefers-color-scheme`, so pick dark mode for first-time
visitors who prefer it, before Quarto reads the stored choice.
-->
<script>
(function () {
  try {
    if (
      window.localStorage.getItem("quarto-color-scheme") === null &&
      window.matchMedia("(prefers-color-scheme: dark)").matches
    ) {
      window.localStorage.setItem("quarto-color-scheme", "alternate");
    }
  } catch (e) {
    // No localStorage: keep Quarto's light default.
  }
})();
</script>
