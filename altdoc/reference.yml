## Source for altdoc/reference.qmd, generated by altdoc/build-site.R.
##
## Same shape as pkgdown's `reference:` field in _pkgdown.yml (see
## https://pkgdown.r-lib.org/reference/build_reference.html), so it stays
## portable if this ever moves to a real pkgdown site or gets upstreamed
## into altdoc (see https://github.com/etiennebacher/altdoc/issues/326).
##
## Each block becomes one `## title` section on the reference page; each
## name under `contents` must match a \name{} or \alias{} in some man/*.Rd
## file. Every exported topic must appear in exactly one block, or
## build_site() will warn (topic missing here) or error (name here with no
## matching Rd).
##
## `greet` and `add` aren't real package functions - they're a toy API
## staged into man/ only for the duration of the build (see
## altdoc/demo/demo.R and stage_demo() in build-site.R), so they only show
## up here while a build is running.

reference:
  - title: All functions
    contents:
      - use_altdown
  - title: Toy demo functions
    desc: >
      Not part of the real package API. Injected doing site
      build for showcase.
    contents:
      - greet
      - add
