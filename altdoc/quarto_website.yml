project:
  type: website
  output-dir: ../docs/
  pre-render: altdown-pre-render.R
language:
  search-text-placeholder: ' Search for'
website:
  title: altdown 0.0.0.9000
  search:
    location: navbar
    type: textbox
  navbar:
    search: true
    left:
    - text: Get started
      file: vignettes/altdown.qmd
    - text: Reference
      file: reference.qmd
    - text: Articles
      menu:
      - text: Technical details
        file: vignettes/articles/technical.qmd
    - text: Changelog
      file: NEWS.md
    right:
    - icon: github
      href: https://github.com/bjarkehautop/altdown
      aria-label: GitHub
  page-footer:
    left: Developed by Bjarke Hautop Kristensen.
    right: Site built with [altdoc](https://altdoc.etiennebacher.com/) and [Quarto](https://quarto.org/),
      using the [altdown](https://github.com/BjarkeHautop/altdown) theme.
format:
  html:
    theme:
      light:
      - default
      - altdown.scss
      dark:
      - darkly
      - altdown.scss
    code-link: true
    toc: true
    include-in-header: altdown-header.html
    include-after-body: altdown-after-body.html
